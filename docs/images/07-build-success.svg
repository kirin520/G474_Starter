<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">编译成功和 ELF 位置示意图</title><desc id="desc">展示输出窗口构建成功以及资源管理器中的 build Debug G474 Starter ELF。</desc>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.white{fill:#f8fafc}.muted{fill:#a1a1aa}.green{fill:#4ade80}.red{fill:none;stroke:#ef4444;stroke-width:4}.n{fill:#ef4444}</style>
  <rect width="1100" height="620" fill="#f8fafc"/><text x="35" y="42" class="title" fill="#111827">看到 Build finished，还要确认 ELF 已生成</text><text x="875" y="42" class="s" fill="#64748b">界面示意图</text>
  <rect x="35" y="75" width="1030" height="500" rx="10" fill="#18181b"/><rect x="35" y="75" width="390" height="500" fill="#252526"/>
  <text x="65" y="115" class="h white">EXPLORER</text><text x="65" y="157" class="t white">⌄ build</text><text x="90" y="194" class="t white">⌄ Debug</text><text x="118" y="231" class="t green">▣ G474_Starter.elf</text><rect x="103" y="202" width="255" height="48" class="red"/><circle cx="363" cy="198" r="16" class="n"/><text x="358" y="204" class="s white">2</text>
  <rect x="425" y="75" width="640" height="500" fill="#111827"/><text x="455" y="115" class="h white">OUTPUT</text>
  <text x="455" y="168" class="s muted">[1/18] Building C object ...</text><text x="455" y="200" class="s muted">[17/18] Linking C executable G474_Starter.elf</text><text x="455" y="232" class="s muted">Memory region         Used Size</text><text x="455" y="264" class="s white">FLASH: ...</text><text x="455" y="296" class="s white">RAM:   ...</text>
  <rect x="455" y="345" width="560" height="72" rx="6" fill="#14532d"/><text x="485" y="389" class="h white">Build finished successfully</text><rect x="445" y="335" width="580" height="92" class="red"/><circle cx="1025" cy="331" r="16" class="n"/><text x="1020" y="337" class="s white">1</text>
  <text x="455" y="478" class="t white">输出文件：</text><text x="455" y="514" class="t green">build/Debug/G474_Starter.elf</text><text x="455" y="548" class="s muted">没有 ELF 时，从输出窗口的第一条 error 开始处理。</text>
</svg>
