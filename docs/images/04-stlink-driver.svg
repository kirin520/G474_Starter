<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">ST-LINK 驱动安装和设备管理器检查示意图</title><desc id="desc">左侧显示 STM32Cube 的驱动入口，右侧显示设备管理器中的 ST-LINK。</desc>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.title{font-size:28px;font-weight:700}.h{font-size:21px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.red{fill:none;stroke:#ef4444;stroke-width:4}.n{fill:#ef4444}.white{fill:#f8fafc}.muted{fill:#64748b}</style>
  <rect width="1100" height="620" fill="#f8fafc"/><text x="35" y="42" class="title" fill="#111827">安装驱动，并确认 Windows 能识别 ST-LINK</text><text x="850" y="42" class="s muted">界面示意图</text>
  <rect x="35" y="75" width="500" height="490" rx="10" fill="#111827"/><text x="65" y="115" class="h white">① STM32Cube Resources</text>
  <rect x="65" y="145" width="440" height="58" rx="5" fill="#1f2937"/><text x="90" y="181" class="t white">ST-Link USB Drivers</text><text x="455" y="181" class="t white">›</text><rect x="55" y="135" width="460" height="78" class="red"/>
  <circle cx="510" cy="132" r="16" class="n"/><text x="505" y="138" class="s white">1</text><text x="65" y="250" class="t white">运行 Windows 驱动安装程序</text><text x="65" y="285" class="s" fill="#94a3b8">安装驱动可能要求管理员权限。</text>
  <rect x="565" y="75" width="500" height="490" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="595" y="115" class="h" fill="#111827">② Windows 设备管理器</text>
  <text x="600" y="166" class="t" fill="#334155">⌄ 通用串行总线设备</text><text x="635" y="212" class="t" fill="#111827">▣ STMicroelectronics STLink dongle</text><rect x="620" y="181" width="400" height="52" class="red"/>
  <circle cx="1020" cy="178" r="16" class="n"/><text x="1015" y="184" class="s white">2</text><text x="600" y="280" class="t" fill="#166534">✓ 名称正常且没有黄色感叹号</text><text x="600" y="325" class="s muted">若完全没有设备：换 USB 数据线和接口。</text><text x="600" y="355" class="s muted">若有感叹号：重新安装驱动。</text>
  <rect x="565" y="470" width="500" height="95" fill="#fff7ed" stroke="#fb923c"/><text x="590" y="505" class="t" fill="#9a3412">能识别 ST-LINK ≠ 能识别目标芯片</text><text x="590" y="535" class="s" fill="#9a3412">No target 时继续检查 3.3 V、VTref、GND、SWDIO、SWCLK、NRST。</text>
</svg>
