<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ST-LINK 与 STM32G474 SWD 五线接线图</title><desc id="desc">VTref、GND、SWDIO、SWCLK 和 NRST 的一一对应连接，并提示 VTref 不等于默认供电。</desc>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:32px;font-weight:700}.h{font-size:24px;font-weight:700}.t{font-size:19px}.s{font-size:15px}.box{fill:#fff;stroke:#334155;stroke-width:3}.wire{fill:none;stroke-width:6}.vref{stroke:#ef4444}.gnd{stroke:#111827}.data{stroke:#3b82f6}.clk{stroke:#8b5cf6}.rst{stroke:#f59e0b}</style>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="45" y="55" class="title">SWD 五线接线：先断电，接好后再上电</text>
  <rect x="75" y="115" width="340" height="420" rx="18" class="box"/><text x="160" y="165" class="h">ST-LINK</text>
  <rect x="785" y="115" width="340" height="420" rx="18" class="box"/><text x="855" y="165" class="h">STM32G474 板卡</text>
  <g class="t"><text x="120" y="225">VTref / 3V3</text><text x="120" y="290">GND</text><text x="120" y="355">SWDIO</text><text x="120" y="420">SWCLK</text><text x="120" y="485">NRST</text>
  <text x="925" y="225">3.3V</text><text x="925" y="290">GND</text><text x="925" y="355">PA13</text><text x="925" y="420">PA14</text><text x="925" y="485">NRST</text></g>
  <circle cx="380" cy="218" r="9" fill="#ef4444"/><circle cx="820" cy="218" r="9" fill="#ef4444"/><path d="M389 218H811" class="wire vref"/>
  <circle cx="380" cy="283" r="9" fill="#111827"/><circle cx="820" cy="283" r="9" fill="#111827"/><path d="M389 283H811" class="wire gnd"/>
  <circle cx="380" cy="348" r="9" fill="#3b82f6"/><circle cx="820" cy="348" r="9" fill="#3b82f6"/><path d="M389 348H811" class="wire data"/><polygon points="585,338 615,348 585,358" fill="#3b82f6"/><polygon points="615,338 585,348 615,358" fill="#3b82f6"/>
  <circle cx="380" cy="413" r="9" fill="#8b5cf6"/><circle cx="820" cy="413" r="9" fill="#8b5cf6"/><path d="M389 413H811" class="wire clk"/><polygon points="790,403 820,413 790,423" fill="#8b5cf6"/>
  <circle cx="380" cy="478" r="9" fill="#f59e0b"/><circle cx="820" cy="478" r="9" fill="#f59e0b"/><path d="M389 478H811" class="wire rst"/><polygon points="790,468 820,478 790,488" fill="#f59e0b"/>
  <rect x="75" y="565" width="1050" height="92" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="105" y="603" class="h" fill="#9a3412">重要：VTref 通常只用于检测目标电压，不默认负责给整块板供电。</text><text x="105" y="634" class="t" fill="#9a3412">开发板使用可靠 3.3 V 电源；ST-LINK、板卡和所有外设必须共地。</text>
</svg>
