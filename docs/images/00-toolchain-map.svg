<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">STM32 从源代码到烧录的工具链关系图</title>
  <desc id="desc">说明 VS Code、官方扩展、CubeMX、CMake、Ninja、GNU 编译器、ELF、GDB Server、Programmer 和 ST-LINK 的分工。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:32px;font-weight:700}.h{font-size:21px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.box{stroke-width:2;rx:12}.blue{fill:#eff6ff;stroke:#3b82f6}.green{fill:#ecfdf5;stroke:#10b981}.orange{fill:#fff7ed;stroke:#f97316}.gray{fill:#f8fafc;stroke:#94a3b8}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="690" fill="#ffffff"/>
  <text x="45" y="55" class="title">从 C 源代码到 MCU：每个工具到底负责什么？</text>
  <rect x="45" y="100" width="270" height="105" class="box blue"/><text x="75" y="140" class="h">VS Code</text><text x="75" y="172" class="t">编辑、按钮和统一界面</text>
  <rect x="380" y="100" width="390" height="105" class="box blue"/><text x="410" y="140" class="h">STM32CubeIDE 扩展 3.x</text><text x="410" y="172" class="t">识别工程并组织下面的工具</text>
  <path d="M315 152H370" class="line"/>
  <rect x="835" y="100" width="320" height="105" class="box orange"/><text x="865" y="140" class="h">STM32CubeMX</text><text x="865" y="172" class="t">.ioc → 生成 Core 代码</text>
  <path d="M835 215C760 255 675 250 620 235" class="line"/>
  <text x="835" y="235" class="s">修改引脚/时钟时使用</text>
  <rect x="45" y="285" width="235" height="105" class="box green"/><text x="75" y="325" class="h">CMake</text><text x="75" y="357" class="t">读取 CMakeLists</text>
  <rect x="330" y="285" width="235" height="105" class="box green"/><text x="360" y="325" class="h">Ninja</text><text x="360" y="357" class="t">执行构建规则</text>
  <rect x="615" y="285" width="280" height="105" class="box green"/><text x="645" y="325" class="h">GNU Tools</text><text x="645" y="357" class="t">编译 + 链接 + GDB</text>
  <rect x="945" y="285" width="210" height="105" class="box orange"/><text x="975" y="325" class="h">.elf</text><text x="975" y="357" class="t">最终程序文件</text>
  <path d="M180 205V275" class="line"/><path d="M280 337H320" class="line"/><path d="M565 337H605" class="line"/><path d="M895 337H935" class="line"/>
  <rect x="145" y="480" width="360" height="110" class="box gray"/><text x="175" y="520" class="h">调试路线</text><text x="175" y="553" class="t">GDB Server → ST-LINK</text>
  <rect x="695" y="480" width="360" height="110" class="box gray"/><text x="725" y="520" class="h">仅烧录路线</text><text x="725" y="553" class="t">CubeProgrammer → ST-LINK</text>
  <path d="M1010 390C970 435 875 440 875 470" class="line"/><path d="M990 390C870 425 490 420 325 470" class="line"/>
  <rect x="410" y="620" width="380" height="55" rx="12" fill="#0f766e"/><text x="475" y="655" class="h" fill="#ffffff">ST-LINK → SWD → STM32G474</text>
  <path d="M325 590C370 620 410 635 400 645" class="line"/><path d="M875 590C830 620 790 635 800 645" class="line"/>
  <text x="45" y="430" class="s" fill="#64748b">绿色工具由 Bundle Manager 按工程版本下载；通常无需手工配置 PATH。</text>
</svg>
