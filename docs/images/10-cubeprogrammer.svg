<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">STM32CubeProgrammer 备用下载流程示意图</title><desc id="desc">依次选择 ST-LINK SWD、连接、选择 ELF、下载和复位。</desc>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.white{fill:#f8fafc}.muted{fill:#64748b}.red{fill:none;stroke:#ef4444;stroke-width:4}.n{fill:#ef4444}</style>
  <rect width="1100" height="660" fill="#f8fafc"/><text x="35" y="42" class="title" fill="#111827">STM32CubeProgrammer：备用下载流程</text><text x="845" y="42" class="s muted">界面示意图</text>
  <rect x="35" y="75" width="1030" height="540" rx="10" fill="#eef2f7" stroke="#cbd5e1"/><rect x="35" y="75" width="1030" height="62" rx="10" fill="#0f4c81"/><text x="65" y="114" class="h white">STM32CubeProgrammer</text>
  <rect x="65" y="165" width="285" height="405" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="90" y="205" class="h" fill="#111827">Connection</text><text x="90" y="248" class="t" fill="#334155">Port: ST-LINK</text><text x="90" y="286" class="t" fill="#334155">Mode: SWD</text><rect x="80" y="222" width="240" height="82" class="red"/><circle cx="326" cy="218" r="16" class="n"/><text x="321" y="224" class="s white">1</text>
  <rect x="90" y="330" width="190" height="48" rx="5" fill="#0f766e"/><text x="145" y="361" class="t white">Connect</text><rect x="80" y="320" width="210" height="68" class="red"/><circle cx="295" cy="316" r="16" class="n"/><text x="290" y="322" class="s white">2</text>
  <rect x="380" y="165" width="650" height="405" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="410" y="205" class="h" fill="#111827">Erasing &amp; Programming</text><text x="410" y="253" class="t" fill="#334155">File path</text><rect x="500" y="225" width="485" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="518" y="253" class="s" fill="#334155">build/Debug/G474_Starter.elf</text><rect x="490" y="215" width="505" height="64" class="red"/><circle cx="997" cy="211" r="16" class="n"/><text x="992" y="217" class="s white">3</text>
  <rect x="410" y="315" width="190" height="50" rx="5" fill="#0f766e"/><text x="470" y="347" class="t white">Download</text><rect x="400" y="305" width="210" height="70" class="red"/><circle cx="615" cy="301" r="16" class="n"/><text x="610" y="307" class="s white">4</text>
  <rect x="650" y="315" width="160" height="50" rx="5" fill="#2563eb"/><text x="704" y="347" class="t white">Reset</text><rect x="640" y="305" width="180" height="70" class="red"/><circle cx="825" cy="301" r="16" class="n"/><text x="820" y="307" class="s white">5</text>
  <rect x="410" y="420" width="575" height="95" rx="6" fill="#ecfdf5" stroke="#22c55e"/><text x="440" y="458" class="t" fill="#166534">✓ File download complete</text><text x="440" y="489" class="s" fill="#166534">完成后 Reset，OLED 应进入主菜单。</text>
</svg>
