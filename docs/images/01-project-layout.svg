<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">G474 Starter 工程目录结构</title>
  <desc id="desc">用不同颜色区分可以修改、只改 USER CODE、由 CubeMX 生成和不建议修改的目录。</desc>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#475569}.h{font-size:22px;font-weight:700}.t{font-size:18px}.small{font-size:15px}.box{stroke-width:2;rx:12}.green{fill:#ecfdf5;stroke:#10b981}.orange{fill:#fff7ed;stroke:#f97316}.blue{fill:#eff6ff;stroke:#3b82f6}.gray{fill:#f8fafc;stroke:#94a3b8}.line{stroke:#64748b;stroke-width:2;fill:none}
  </style>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="50" y="58" class="title">先认识工程：从哪里开始读？</text>
  <text x="50" y="88" class="sub">建议路线：main.c → User/Inc → User/Src → 对应的 CubeMX 初始化文件</text>
  <rect x="50" y="125" width="280" height="70" class="box blue"/>
  <text x="75" y="157" class="h">G474_Starter.ioc</text><text x="75" y="181" class="small">引脚、时钟、外设配置源</text>
  <path d="M190 195V225" class="line"/>
  <rect x="50" y="225" width="520" height="135" class="box orange"/>
  <text x="75" y="260" class="h">Core/</text><text x="170" y="260" class="t">CubeMX 生成的基础工程</text>
  <text x="75" y="294" class="t">Core/Src/main.c</text><text x="285" y="294" class="small">先读；只改 USER CODE 区域</text>
  <text x="75" y="325" class="t">gpio.c / i2c.c / spi.c / usart.c ...</text>
  <text x="75" y="348" class="small">看初始化结果，配置要回到 .ioc 修改</text>
  <path d="M570 292H625" class="line"/>
  <rect x="625" y="225" width="525" height="135" class="box green"/>
  <text x="650" y="260" class="h">User/</text><text x="735" y="260" class="t">最适合初学者阅读和修改</text>
  <text x="650" y="294" class="t">Inc/*.h</text><text x="790" y="294" class="small">公开接口：有哪些函数</text>
  <text x="650" y="325" class="t">Src/*.c</text><text x="790" y="325" class="small">驱动实现：函数怎样工作</text>
  <text x="650" y="348" class="small">OLED、FRAM、SD、Encoder、CAN</text>
  <rect x="50" y="395" width="340" height="105" class="box gray"/>
  <text x="75" y="430" class="h">Drivers/</text><text x="75" y="461" class="t">ST HAL / CMSIS</text><text x="75" y="485" class="small">只读学习，不要修改</text>
  <rect x="430" y="395" width="340" height="105" class="box gray"/>
  <text x="455" y="430" class="h">ThirdParty/FatFs/</text><text x="455" y="461" class="t">SD 文件系统</text><text x="455" y="485" class="small">先把它当作库使用</text>
  <rect x="810" y="395" width="340" height="105" class="box green"/>
  <text x="835" y="430" class="h">CMakeLists.txt</text><text x="835" y="461" class="t">用户源码与头文件列表</text><text x="835" y="485" class="small">新增 .c 文件时更新</text>
  <rect x="50" y="535" width="1100" height="125" rx="12" fill="#0f172a"/>
  <text x="80" y="575" class="h" fill="#ffffff">颜色说明</text>
  <circle cx="230" cy="570" r="12" fill="#10b981"/><text x="250" y="577" class="t" fill="#ffffff">可以修改</text>
  <circle cx="405" cy="570" r="12" fill="#f97316"/><text x="425" y="577" class="t" fill="#ffffff">只改 USER CODE</text>
  <circle cx="630" cy="570" r="12" fill="#3b82f6"/><text x="650" y="577" class="t" fill="#ffffff">通过 CubeMX 修改</text>
  <circle cx="870" cy="570" r="12" fill="#94a3b8"/><text x="890" y="577" class="t" fill="#ffffff">不建议修改</text>
  <text x="80" y="625" class="t" fill="#dbeafe">记住：应用流程看 main.c；驱动看 User/；硬件配置改 .ioc；Drivers 不动。</text>
</svg>
