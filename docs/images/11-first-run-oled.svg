<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">OLED 首次运行主菜单示意图</title><desc id="desc">显示 G474 DEMO MENU，System Status、LED Test、Key Test 等菜单以及编码器和 PC2 操作。</desc>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.title{font-size:30px;font-weight:700}.h{font-size:24px;font-weight:700}.t{font-size:19px}.oled{font-family:Consolas,monospace;font-size:22px;fill:#dbeafe}.s{font-size:15px}</style>
  <rect width="1100" height="650" fill="#f8fafc"/><text x="45" y="48" class="title" fill="#111827">第一次运行：OLED 应出现主菜单</text>
  <rect x="80" y="105" width="660" height="390" rx="28" fill="#111827" stroke="#334155" stroke-width="12"/><rect x="120" y="145" width="580" height="310" rx="6" fill="#031b2d" stroke="#38bdf8" stroke-width="3"/>
  <text x="150" y="188" class="oled">G474 DEMO MENU</text><line x1="145" y1="200" x2="675" y2="200" stroke="#38bdf8"/>
  <rect x="140" y="216" width="540" height="38" fill="#0c4a6e"/><text x="150" y="243" class="oled">&gt; System Status</text><text x="150" y="283" class="oled">  LED Test</text><text x="150" y="323" class="oled">  Key Test</text><text x="150" y="363" class="oled">  Encoder Test</text><text x="150" y="403" class="oled">  DIP Switch</text><text x="150" y="443" class="oled">  FRAM Test</text>
  <rect x="790" y="120" width="250" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="820" y="165" class="h" fill="#065f46">旋转编码器</text><text x="820" y="207" class="t" fill="#065f46">上下选择菜单</text>
  <rect x="790" y="280" width="250" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="820" y="325" class="h" fill="#1e40af">PC2 短按</text><text x="820" y="367" class="t" fill="#1e40af">进入 / 执行测试</text>
  <rect x="790" y="440" width="250" height="130" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="820" y="485" class="h" fill="#9a3412">PC2 长按</text><text x="820" y="527" class="t" fill="#9a3412">800 ms 返回菜单</text>
  <text x="80" y="560" class="t" fill="#334155">建议第一项测试：LED Test。PB11 为低电平点亮。</text><text x="80" y="595" class="s" fill="#64748b">此图为显示内容示意，不是 OLED 实物照片；实际字体和对比度会因模块而异。</text>
</svg>
