<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">VS Code Run and Debug 下载界面示意图</title><desc id="desc">展示选择 ST-Link GDB Server、按 F5，并说明程序会停在 main。</desc>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.white{fill:#f8fafc}.muted{fill:#a1a1aa}.red{fill:none;stroke:#ef4444;stroke-width:4}.n{fill:#ef4444}</style>
  <rect width="1100" height="650" fill="#f8fafc"/><text x="35" y="42" class="title" fill="#111827">F5：构建、下载，然后停在 main()</text><text x="855" y="42" class="s" fill="#64748b">界面示意图</text>
  <rect x="35" y="75" width="1030" height="530" rx="10" fill="#18181b"/><rect x="35" y="75" width="60" height="530" fill="#202020"/><text x="52" y="180" class="t white">▷</text><rect x="42" y="145" width="46" height="52" class="red"/><circle cx="90" cy="140" r="16" class="n"/><text x="85" y="146" class="s white">1</text>
  <rect x="95" y="75" width="410" height="530" fill="#252526"/><text x="120" y="115" class="h white">RUN AND DEBUG</text>
  <rect x="120" y="150" width="360" height="52" rx="4" fill="#3c3c3c"/><text x="140" y="182" class="s white">STM32Cube: Launch ST-Link GDB Server</text><rect x="110" y="140" width="380" height="72" class="red"/><circle cx="493" cy="136" r="16" class="n"/><text x="488" y="142" class="s white">2</text>
  <rect x="120" y="240" width="120" height="48" rx="4" fill="#15803d"/><text x="155" y="271" class="t white">▷ F5</text><rect x="110" y="230" width="140" height="68" class="red"/><circle cx="253" cy="226" r="16" class="n"/><text x="248" y="232" class="s white">3</text>
  <rect x="505" y="75" width="560" height="530" fill="#1e1e1e"/><text x="535" y="115" class="h white">Core/Src/main.c</text><text x="535" y="170" class="s muted">857   int main(void)</text><text x="535" y="205" class="s muted">858   {</text><rect x="525" y="220" width="500" height="50" fill="#4d4a18"/><text x="535" y="252" class="t white">859       HAL_Init();</text><polygon points="512,235 525,245 512,255" fill="#facc15"/>
  <text x="535" y="315" class="t" fill="#facc15">黄色箭头停在 main 是正常的</text><text x="535" y="352" class="t white">再按一次 F5，程序继续运行。</text><text x="535" y="405" class="s muted">若提示 No target，检查供电、VTref、GND、</text><text x="535" y="432" class="s muted">PA13/PA14 和 NRST，而不是修改业务代码。</text>
</svg>
