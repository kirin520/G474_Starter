<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">打开正确工程根目录界面示意图</title><desc id="desc">展示 VS Code 资源管理器顶层应直接出现 ioc、CMakeLists 和 Core、User。</desc>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.title{font-size:28px;font-weight:700}.h{font-size:19px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.white{fill:#f8fafc}.muted{fill:#a1a1aa}.red{fill:none;stroke:#ef4444;stroke-width:4}.n{fill:#ef4444}</style>
  <rect width="1100" height="620" fill="#f8fafc"/><text x="35" y="42" class="title" fill="#111827">打开工程根目录，不要只打开 Core 或 User</text><text x="870" y="42" class="s" fill="#64748b">界面示意图</text>
  <rect x="35" y="75" width="1030" height="500" rx="10" fill="#18181b"/><rect x="35" y="75" width="430" height="500" fill="#252526"/>
  <text x="62" y="115" class="h white">EXPLORER</text><text x="62" y="155" class="h white">⌄ G474_STARTER</text>
  <g class="t white"><text x="85" y="195">▣ G474_Starter.ioc</text><text x="85" y="228">▣ CMakeLists.txt</text><text x="85" y="261">▣ CMakePresets.json</text><text x="85" y="294">⌄ Core</text><text x="85" y="327">⌄ User</text><text x="85" y="360">› Drivers</text><text x="85" y="393">› ThirdParty</text><text x="85" y="426">▣ README.md</text></g>
  <rect x="69" y="167" width="350" height="280" class="red"/><circle cx="422" cy="163" r="16" class="n"/><text x="417" y="169" class="s white">2</text>
  <rect x="500" y="115" width="520" height="120" rx="8" fill="#0f766e"/><text x="530" y="158" class="h white">正确判断</text><text x="530" y="194" class="t white">顶层同时看见 .ioc 和 CMakeLists.txt</text>
  <rect x="500" y="270" width="520" height="160" rx="8" fill="#7f1d1d"/><text x="530" y="312" class="h white">错误示例</text><text x="530" y="349" class="t white">只看见 Inc / Src：你打开了 Core</text><text x="530" y="384" class="t white">只看见另一个 G474_Starter：外面多一层</text>
  <rect x="500" y="470" width="520" height="60" rx="8" fill="#1f2937"/><text x="530" y="507" class="t white">① File → Open Folder → 选择正确根目录</text>
  <circle cx="1008" cy="465" r="16" class="n"/><text x="1003" y="471" class="s white">1</text>
</svg>
